<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎓 Congrats!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    html, body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    /* Standalone page hardening */
    .giscus, #giscus, [data-giscus], .toc, #toc, .post-toc, .post-toc-wrap { display: none !important; visibility: hidden !important; }
    header, nav, [role="banner"], [role="navigation"],
    .header, .site-header, .navbar, .top-nav, .site-navbar, .site-nav, .menu, .menu-wrap, .nav-container, .navbar-container, .navbar-inner, #header,
    footer, .footer, .site-footer, #footer,
    .post-meta, .article-meta, .post-footer, .article-footer,
    .post-copyright, .post-license, .license, .article-license,
    .post-nav, .post-navigation, .post-info, .post-about, .post-end, .post-notice, .post-block,
    .breadcrumb, .subnav, .page-footer, .sidebar, aside, .widget { display: none !important; }
    body { margin: 0 !important; }

    /* Simple pop animation for gift card */
    @keyframes popIn { 0% { transform: scale(.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .pop-in { animation: popIn .35s ease-out both; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 text-slate-800">
  <main class="min-h-screen max-w-3xl mx-auto px-6 flex items-center justify-center">
    <!-- Centered Hero -->
    <section id="hero" class="w-full text-center space-y-6 flex flex-col items-center justify-center">
      <h1 class="leading-tight space-y-2">
        <span class="block text-5xl md:text-6xl font-extrabold">🎊Congrats🎊</span>
        <span id="name" class="block text-5xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600">🎓Dr. Hendrik Erz</span>
      </h1>
      <p class="text-lg opacity-80">Let's start some celebration!</p>

      <div class="space-y-3">
        <button id="startBtn" class="px-6 py-3 rounded-2xl bg-indigo-600 text-white font-semibold shadow-lg hover:shadow-xl hover:bg-indigo-700 transition">
          Start the celebration
        </button>
        <div>
          <button id="goGiftBtn" class="px-5 py-2 rounded-2xl border border-indigo-300 text-indigo-700 bg-white/80 shadow hidden">
            Reveal the gift 🎁
          </button>
        </div>
      </div>

      <canvas id="confetti-layer" class="fixed inset-0 w-screen h-screen pointer-events-none z-50"></canvas>
    </section>

    <!-- Gift card (initially hidden) -->
    <section id="gift" class="hidden w-full text-center space-y-4">
      <h2 class="text-3xl font-extrabold">Your Digital Gift 🎁</h2>
      <p class="opacity-80">Use the code below or scan the QR to claim it.</p>
      <div class="bg-white rounded-2xl shadow p-6 space-y-3 mx-auto max-w-md pop-in">
        <div class="flex justify-center">
          <img
            src="https://images.v3.snowfirehub.com/qid_RBLdEQM_EE8i0TTaWtKrlKs=/fit-in/1170x1170/smart/https%3A%2F%2Fassets.v3.snowfirehub.com%2Fimages%2F121779%2Fvariants%2F133-o-fit-rityta-1.png"
            alt="Celebratory illustration"
            class="w-full max-w-xs mx-auto rounded-xl shadow-sm"
            loading="lazy"
            referrerpolicy="no-referrer"
          />
        </div>
        <div class="text-sm uppercase tracking-wide text-slate-500">Gift Code</div>
        <div class="text-2xl font-mono" id="gift-code">CONCERTS-FOR-DR-ERZ</div>
        <div class="flex justify-center">
          <img id="gift-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=ABCD-EFGH-IJKL" alt="QR Code" class="rounded-lg" />
        </div>
        <button id="copyBtn" class="px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-800">Copy code</button>
      </div>
      <p class="text-sm opacity-60">(P.S. This code’s just a teaser — the real one’s tucked in the postcard😉.)</p>
      <button id="backBtn" class="mt-4 px-5 py-2 rounded-2xl border border-slate-300 bg-white/80 text-slate-700 hover:bg-white shadow">Back to celebration</button>
    </section>
  </main>

  <script>
    // Personalize the name via ?name=
    const params = new URLSearchParams(location.search);
    const n = params.get('name');
    if (n) {
      const el = document.getElementById('name');
      const val = decodeURIComponent(n);
      el.textContent = val.startsWith('🎓') ? val : `🎓${val}`;
    }

    // Confetti setup (fullscreen singleton)
    const hasConfetti = typeof window.confetti === 'function';
    const confetti = hasConfetti ? window.confetti : null;

    function burst(){
      if(!confetti) return;
      confetti({ particleCount: 140, spread: 90, origin: { y: 0.6 } });
      setTimeout(()=> confetti({ particleCount: 110, angle: 60, spread: 65, origin: { x: 0 } }), 180);
      setTimeout(()=> confetti({ particleCount: 110, angle: 120, spread: 65, origin: { x: 1 } }), 360);
    }

    function fireworks(duration = 4000){
      if(!confetti) return;
      const end = Date.now() + duration;
      (function frame(){
        // bottom launchers
        confetti({ particleCount: 6, startVelocity: 60, spread: 70, ticks: 90, gravity: 1.1, origin: { x: Math.random()*0.25 + 0.02, y: 1 }, angle: 60 });
        confetti({ particleCount: 6, startVelocity: 60, spread: 70, ticks: 90, gravity: 1.1, origin: { x: Math.random()*0.25 + 0.73, y: 1 }, angle: 120 });
        // sky bursts across the viewport
        for (let i = 0; i < 3; i++) {
          confetti({ particleCount: 12, spread: 360, startVelocity: 40, ticks: 100, origin: { x: Math.random(), y: Math.random()*0.95 }, scalar: 0.9 });
        }
        // corners for full coverage
        confetti({ particleCount: 8, spread: 80, startVelocity: 45, ticks: 80, origin: { x: 0.05, y: 0.05 } });
        confetti({ particleCount: 8, spread: 80, startVelocity: 45, ticks: 80, origin: { x: 0.95, y: 0.05 } });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    const startBtn = document.getElementById('startBtn');
    const goGiftBtn = document.getElementById('goGiftBtn');
    const backBtn = document.getElementById('backBtn');
    const gift = document.getElementById('gift');
    const hero = document.getElementById('hero');

    // On start: burst + fireworks + reveal the "Reveal the gift" button. Stay on hero.
    startBtn.addEventListener('click', () => {
      if (startBtn.dataset.running === '1') return;
      startBtn.dataset.running = '1';
      burst();
      const DURATION = 4000;
      fireworks(DURATION);
      goGiftBtn.classList.remove('hidden');
      setTimeout(() => { startBtn.dataset.running = '0'; }, DURATION + 100);
    });

    // Reveal the gift: hide hero, show only the gift section with a pop animation, and scroll to top
    goGiftBtn.addEventListener('click', () => {
      hero.classList.add('hidden');
      gift.classList.remove('hidden');
      const card = gift.querySelector('.bg-white');
      if (card) {
        card.classList.remove('pop-in');
        void card.offsetWidth; // reflow to restart animation
        card.classList.add('pop-in');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Back to celebration: hide gift, show hero again (keep reveal button visible)
    backBtn.addEventListener('click', () => {
      gift.classList.add('hidden');
      hero.classList.remove('hidden');
      goGiftBtn.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      startBtn.focus();
    });

    // Copy gift code (with fallback)
    document.getElementById('copyBtn').addEventListener('click', () => {
      const code = document.getElementById('gift-code').textContent.trim();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => alert('Gift code copied!'));
      } else {
        const ta = document.createElement('textarea');
        ta.value = code; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); alert('Gift code copied!'); } finally { ta.remove(); }
      }
    });

    // --- RUNTIME TESTS --- (console only)
    (function runTests(){
      const results = [];
      function assert(c, m){ if(!c) throw new Error(m); }
      function test(n, f){ try { f(); results.push({ Test:n, Pass:true }); } catch(e){ results.push({ Test:n, Pass:false, Error:e.message }); } }

      // Passive tests (no UI side-effects)
      test('Hero is centered via flex', () => {
        const main = document.querySelector('main');
        assert(/items-center/.test(main.className) && /justify-center/.test(main.className), 'main not centered');
      });
      test('Reveal button exists & label', () => {
        const btn = document.getElementById('goGiftBtn');
        assert(btn && /Reveal the gift/i.test(btn.textContent), 'Reveal button missing or wrong label');
      });
      test('Reveal button hidden initially', () => {
        const btn = document.getElementById('goGiftBtn');
        assert(btn.classList.contains('hidden'), 'Reveal button should start hidden');
      });
      test('Gift section hidden initially', () => {
        const g = document.getElementById('gift');
        assert(g.classList.contains('hidden'), 'gift should start hidden');
      });
      test('Confetti available', () => {
        assert(typeof window.confetti === 'function', 'window.confetti missing');
      });

      // Interaction tests are DISABLED by default to avoid auto-triggering fireworks.
      // Enable by visiting with ?autotest=1 in the URL.
      if (new URLSearchParams(location.search).get('autotest') === '1') {
        test('Start click reveals Reveal button but not gift', () => {
          document.getElementById('startBtn').click();
          const btn = document.getElementById('goGiftBtn');
          const g = document.getElementById('gift');
          assert(!btn.classList.contains('hidden') && g.classList.contains('hidden'), 'Start should show reveal button only');
        });
        test('Reveal click hides hero and shows gift', () => {
          document.getElementById('goGiftBtn').click();
          const h = document.getElementById('hero');
          const g = document.getElementById('gift');
          assert(h.classList.contains('hidden') && !g.classList.contains('hidden'), 'Reveal should show only gift');
        });
        test('Back to celebration shows hero again', () => {
          document.getElementById('backBtn').click();
          const h = document.getElementById('hero');
          const g = document.getElementById('gift');
          assert(!h.classList.contains('hidden') && g.classList.contains('hidden'), 'Back should show hero and hide gift');
        });
      }

      console.table(results);
    })();
  </script>
</body>
</html>
